- type: entity
  id: BoxFolderSC
  parent: BoxFolderBase
  name: SC folder
  description: A folder filled with paperwork templates.
  suffix: Forms
  components:
  - type: Sprite
    layers:
    - state: folder-colormap
      color: "#00076e"
    - state: folder-base
  - type: StorageFill
    contents:
    - id: PaperWrittenFrontierEmployment
    - id: PaperWrittenFrontierEmployeePayHistory
    - id: PaperWrittenFrontierFundRequisition
    - id: PaperWrittenFrontierShuttleTitleChange
    - id: PaperWrittenFrontierAuthorization
    - id: PaperWrittenFrontierShuttleDerelict
    - id: PaperWrittenFrontierContrabandAmnesty
    - id: PaperWrittenFrontierContrabandTurnover
    - id: PaperWrittenFrontierContrabandPermit
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5

# Signs

- type: entity
  parent: BaseSignDirectionalNF
  id: SignDirectionalSC
  name: sc sign
  description: A direction sign, pointing out which way the station's commander's office is.
  components:
  - type: Sprite
    sprite: _ARC/Structures/wall-signs-posters/direction-signs/station-commander.rsi
    state: direction_sc

# Holopads

- type: entity
  parent: NFHolopadPoiBase
  id: NFHolopadFrontierOutpostSC
  suffix: Arcadis Station Commander, POI
  components:
  - type: Label
    currentLabel: arc-holopad-general-arcadis-station-commander